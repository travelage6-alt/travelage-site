<style>
/* Layout idea: the logo's four-part globe drives everything. Big quadrant hero, a row of tall destination posters, package posters drawn in the brand colours, offers as boarding passes. */
:root{
  --ink:#16142E;
  --paper:#F5F4FA;
  --card:#FFFFFF;
  --indigo:#5A55A0;
  --coral:#EA4E6E;
  --sun:#FCC21B;
  --muted:#5F5C78;
  --line:#E2E0EE;
  --display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Alexandria",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:22px;
  --wrap:1220px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.skip{position:absolute;inset-inline-start:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;z-index:99}
.skip:focus{inset-inline-start:8px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.top.scrolled{border-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:76px}
.brand img{height:44px;width:auto}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{text-decoration:none;font-family:var(--display);font-size:15px;font-weight:500;padding:8px 14px;border-radius:999px;color:var(--muted);transition:color .2s,background .2s}
.nav a:hover{color:var(--ink);background:#fff}
.tools{display:flex;gap:8px;align-items:center}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-family:var(--display);font-size:14px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:600;font-size:15px;border-radius:999px;padding:12px 22px;border:0;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{box-shadow:0 10px 24px -10px var(--ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn-coral{background:var(--coral);color:#fff}
.btn svg{width:18px;height:18px}
.top .btn{padding:10px 18px}
.menu{display:none;border:1px solid var(--line);background:#fff;border-radius:999px;width:42px;height:42px;align-items:center;justify-content:center}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding-block:clamp(40px,6vw,80px) clamp(48px,6vw,72px)}
.hero .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,5vw,72px);align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.01em}
.eyebrow i{display:inline-grid;grid-template-columns:1fr 1fr;width:16px;height:16px;gap:2px;transform:rotate(45deg)}
.eyebrow i b{border-radius:2px}
.eyebrow i b:nth-child(1){background:var(--coral)}.eyebrow i b:nth-child(2){background:var(--sun)}.eyebrow i b:nth-child(3){background:var(--indigo)}.eyebrow i b:nth-child(4){background:var(--ink)}
.hero h1{font-size:clamp(46px,7.4vw,104px);font-weight:800;letter-spacing:-.02em;margin-block:18px 22px;line-height:1.05}
html[lang=en] .hero h1{letter-spacing:-.035em}
.hero h1 .hl{position:relative;white-space:nowrap;color:var(--indigo)}
.hero h1 .hl::after{content:"";position:absolute;inset-inline:0;bottom:.04em;height:.16em;background:var(--sun);z-index:-1;border-radius:4px;transform-origin:right;animation:swipe .9s .5s cubic-bezier(.7,0,.2,1) both}
html[lang=en] .hero h1 .hl::after{transform-origin:left}
@keyframes swipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero p.lead{font-size:clamp(17px,1.5vw,20px);color:var(--muted);max-width:52ch;margin:0 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.trust{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:34px;font-size:14px;color:var(--muted)}
.trust span{display:inline-flex;align-items:center;gap:8px}
.trust b{font-family:var(--mono);font-weight:700;color:var(--ink);font-size:13px}

.globe{position:relative;aspect-ratio:1;width:100%;max-width:520px;justify-self:center}
.globe svg{width:100%;height:100%;overflow:visible}
.q{transform-box:fill-box;transform-origin:center;animation:qin 1s cubic-bezier(.2,.8,.2,1) both}
.q1{--dx:0;--dy:-60px;animation-delay:.05s}.q2{--dx:60px;--dy:0;animation-delay:.15s}.q3{--dx:0;--dy:60px;animation-delay:.25s}.q4{--dx:-60px;--dy:0;animation-delay:.35s}
@keyframes qin{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.9)}to{opacity:1;transform:none}}
.orbit{animation:spin 38s linear infinite;transform-origin:260px 260px}
@keyframes spin{to{transform:rotate(360deg)}}
.tag{font-family:var(--mono);font-size:13px;font-weight:700}
.globe .chip{position:absolute;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 18px 40px -18px rgba(22,20,46,.35);font-size:13px;line-height:1.35;display:flex;gap:10px;align-items:center;animation:float 6s ease-in-out infinite}
.globe .chip b{font-family:var(--display);font-size:15px;display:block}
.globe .chip .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:11px;color:#fff;flex:none}
.chip.c1{top:8%;inset-inline-end:-4%}
.chip.c2{bottom:10%;inset-inline-start:-6%;animation-delay:-3s}
@keyframes float{50%{transform:translateY(-10px)}}

/* ---------- destination strip ---------- */
.dests{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:clamp(36px,5vw,56px)}
.dest-card{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;border:0;padding:0;text-align:start;color:#fff;background:var(--ink);isolation:isolate;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.dest-card:hover{transform:translateY(-8px);box-shadow:0 34px 60px -30px rgba(22,20,46,.55)}
.dest-card svg{position:absolute;inset:0;width:100%;height:100%;z-index:-2;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.dest-card:hover svg{transform:scale(1.07)}
.dest-card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(22,20,46,0) 35%,rgba(22,20,46,.88) 100%)}
.dest-card .dc-top{position:absolute;top:16px;inset-inline:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dest-card .dc-code{font-family:var(--mono);font-weight:700;font-size:12px;background:rgba(255,255,255,.92);color:var(--ink);padding:5px 9px;border-radius:8px;direction:ltr}
.dest-card .dc-days{font-family:var(--display);font-size:12px;font-weight:500;background:rgba(22,20,46,.72);padding:5px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.dest-card .dc-body{position:absolute;inset-inline:20px;bottom:20px;display:flex;flex-direction:column;gap:4px}
.dest-card .dc-country{font-size:13px;opacity:.75;font-family:var(--display)}
.dest-card h3{font-size:clamp(24px,2.3vw,32px);font-weight:700;letter-spacing:-.01em}
.dest-card .dc-price{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);font-size:13px}
.dest-card .dc-price b{font-family:var(--display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.dest-card .dc-go{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;transition:background .25s,color .25s}
.dest-card .dc-go svg{position:static;width:16px;height:16px;z-index:0}
html[dir=rtl] .dest-card .dc-go svg{transform:scaleX(-1)}
.dest-card:hover .dc-go{background:var(--sun)}
.dest-card:hover .dc-go svg{transform:none}
html[dir=rtl] .dest-card:hover .dc-go svg{transform:scaleX(-1)}

/* ---------- sections ---------- */
section{padding-block:clamp(64px,8vw,112px)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:clamp(28px,4vw,48px);flex-wrap:wrap}
.sec-head h2{font-size:clamp(34px,4.6vw,60px);font-weight:700;letter-spacing:-.015em}
.sec-head p{color:var(--muted);max-width:46ch;margin:10px 0 0}
.kicker{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--coral);letter-spacing:.06em;margin-bottom:12px;display:block;direction:ltr;text-align:start}
html[dir=rtl] .kicker{text-align:right}

/* services */
.services{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.svc{background:var(--card);padding:28px 26px 30px;display:flex;flex-direction:column;gap:12px;transition:background .25s}
.svc:hover{background:#FBFAFF}
.svc .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.svc .ic svg{width:24px;height:24px}
.svc h3{font-size:19px;font-weight:600}
.svc p{margin:0;color:var(--muted);font-size:15px;line-height:1.65}

/* packages */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-family:var(--display);font-size:14px;font-weight:500;color:var(--muted)}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.pkgs{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(18px,2.4vw,28px)}
.pkg{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;text-align:start;padding:0;width:100%}
.pkg:hover{transform:translateY(-6px);box-shadow:0 30px 60px -30px rgba(22,20,46,.35)}
.pkg .art{position:relative;aspect-ratio:16/10;overflow:hidden}
.pkg .art svg{width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.pkg:hover .art svg{transform:scale(1.04)}
.pkg .code{position:absolute;top:16px;inset-inline-start:16px;font-family:var(--mono);font-weight:700;font-size:13px;background:rgba(255,255,255,.92);padding:6px 10px;border-radius:8px;direction:ltr}
.pkg .cat{position:absolute;top:16px;inset-inline-end:16px;font-family:var(--display);font-size:13px;font-weight:500;background:var(--ink);color:#fff;padding:6px 12px;border-radius:999px}
.pkg .body{padding:24px 26px 26px;display:flex;flex-direction:column;gap:12px;flex:1}
.pkg .meta{display:flex;gap:14px;font-size:14px;color:var(--muted);align-items:center;flex-wrap:wrap}
.pkg .meta span{display:inline-flex;gap:6px;align-items:center}
.pkg .meta svg{width:16px;height:16px}
.pkg h3{font-size:26px;font-weight:700;letter-spacing:-.01em}
.pkg p{margin:0;color:var(--muted);font-size:15.5px}
.pkg .foot{display:flex;justify-content:space-between;align-items:end;margin-top:auto;padding-top:16px;border-top:1px dashed var(--line);gap:12px}
.price small{display:block;font-size:13px;color:var(--muted)}
.price b{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.price b em{font-style:normal;font-size:15px;font-weight:500;margin-inline-start:6px;color:var(--muted)}
.arrow{width:48px;height:48px;border-radius:50%;background:var(--paper);display:grid;place-items:center;transition:background .25s,color .25s;flex:none}
.arrow svg{width:20px;height:20px}
html[dir=rtl] .arrow svg{transform:scaleX(-1)}
.pkg:hover .arrow{background:var(--coral);color:#fff}

/* offers: boarding passes */
.offers-sec{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.offers-sec .sec-head p{color:rgba(255,255,255,.65)}
.offers-sec .kicker{color:var(--sun)}
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.pass{position:relative;display:grid;grid-template-rows:auto 1fr;background:#fff;color:var(--ink);border-radius:var(--r);overflow:hidden;--c:var(--coral)}
.pass .stub{background:var(--c);color:#fff;padding:22px 24px 26px;position:relative}
.pass .stub .badge{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
.pass .stub .route{display:flex;align-items:center;gap:10px;margin-top:10px;font-family:var(--mono);font-weight:700;font-size:14px;direction:ltr;justify-content:flex-start;opacity:.92}
html[dir=rtl] .pass .stub .route{justify-content:flex-end}
.pass .stub .route i{flex:1;max-width:80px;border-top:2px dashed rgba(255,255,255,.7);position:relative}
.pass .perf{position:absolute;inset-inline:0;bottom:-10px;height:20px;display:flex;justify-content:space-between}
.pass .perf::before,.pass .perf::after{content:"";width:20px;height:20px;border-radius:50%;background:var(--ink);margin-inline:-10px}
.pass .main{padding:26px 24px 24px;display:flex;flex-direction:column;gap:12px;border-top:2px dashed var(--line)}
.pass h3{font-size:21px;font-weight:700}
.pass p{margin:0;color:var(--muted);font-size:15px}
.pass .fields{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-top:auto;padding-top:14px}
.pass .fields small{display:block;font-size:12px;color:var(--muted);font-family:var(--display)}
.pass .fields b{font-family:var(--mono);font-size:15px}
.copy{border:1.5px dashed var(--ink);background:none;border-radius:10px;padding:8px 12px;font-family:var(--mono);font-weight:700;font-size:15px;display:inline-flex;gap:8px;align-items:center;direction:ltr}
.copy svg{width:16px;height:16px}
.copy:hover{background:var(--paper)}
.barcode{height:34px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px);opacity:.85;border-radius:2px;margin-top:4px}
.pass .link{font-family:var(--display);font-size:14px;font-weight:600;color:var(--indigo);background:none;border:0;padding:0;text-align:start;text-decoration:underline;text-underline-offset:4px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,3vw,40px);counter-reset:s;position:relative}
.step{position:relative;padding-top:78px}
.step .n{position:absolute;top:0;inset-inline-start:0;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;color:#fff}
.step h3{font-size:23px;font-weight:700;margin-bottom:8px}
.step p{margin:0;color:var(--muted)}
.step:not(:last-child)::after{content:"";position:absolute;top:30px;inset-inline-start:76px;inset-inline-end:-24px;border-top:2px dashed var(--line)}

/* journal */
.posts{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:auto auto;gap:24px}
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:start;padding:0;width:100%;transition:transform .3s,box-shadow .3s}
.post:hover{transform:translateY(-4px);box-shadow:0 24px 50px -30px rgba(22,20,46,.35)}
.post:first-child{grid-row:span 2}
.post .art{aspect-ratio:16/9;overflow:hidden}
.post:first-child .art{aspect-ratio:auto;flex:1;min-height:260px}
.post .art svg{width:100%;height:100%}
.post:not(:first-child){flex-direction:row}
.post:not(:first-child) .art{width:38%;aspect-ratio:auto;flex:none}
.post .body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px}
.post .tagline{display:flex;gap:10px;font-size:13px;color:var(--muted);font-family:var(--display)}
.post .tagline b{color:var(--coral);font-weight:600}
.post h3{font-size:21px;font-weight:700}
.post:first-child h3{font-size:clamp(24px,2.4vw,32px)}
.post p{margin:0;color:var(--muted);font-size:15px}

/* advice */
.advice-wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(24px,5vw,72px);align-items:start}
.advice-intro{position:sticky;top:110px}
.advice-intro p{color:var(--muted)}
.acc{display:grid;gap:10px}
.acc-group{font-family:var(--display);font-size:13px;font-weight:600;color:var(--indigo);margin:18px 0 2px}
.acc-group:first-child{margin-top:0}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;transition:border-color .2s}
details[open]{border-color:var(--indigo)}
summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center;font-family:var(--display);font-weight:600;font-size:17px}
summary::-webkit-details-marker{display:none}
summary .pm{width:28px;height:28px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none;transition:transform .3s,background .3s}
summary .pm svg{width:14px;height:14px}
details[open] summary .pm{transform:rotate(45deg);background:var(--sun)}
details .ans{padding:0 22px 20px;color:var(--muted);font-size:15.5px}
details .ans p{margin:0 0 10px}

/* about / contact */
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:24px}
.about-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(26px,4vw,44px)}
.about-card h2{font-size:clamp(30px,3.6vw,46px);font-weight:700;margin-bottom:18px}
.about-card p{color:var(--muted);margin:0 0 14px;max-width:58ch}
.creds{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:26px}
.cred{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cred small{display:block;font-size:12px;color:var(--muted);font-family:var(--display)}
.cred b{font-family:var(--mono);font-size:16px;direction:ltr;display:inline-block}
.cred.full{grid-column:span 2}
.contact{background:var(--indigo);color:#fff;border-radius:var(--r);padding:clamp(26px,4vw,40px);display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.contact h3{font-size:28px;font-weight:700}
.contact p{margin:0;color:rgba(255,255,255,.78)}
.clist{display:grid;gap:10px}
.clist a,.clist div{display:flex;gap:14px;align-items:center;text-decoration:none;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.1);transition:background .2s}
.clist a:hover{background:rgba(255,255,255,.18)}
.clist svg{width:20px;height:20px;flex:none}
.clist small{display:block;font-size:12px;opacity:.7;font-family:var(--display)}
.clist span{font-size:15px;line-height:1.4}
.ltr{direction:ltr;unicode-bidi:isolate}
.socials{display:flex;gap:8px;flex-wrap:wrap}
.socials a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);transition:background .2s,transform .2s}
.socials a:hover{background:var(--sun);color:var(--ink);transform:translateY(-2px)}
.socials svg{width:20px;height:20px}
.contact .btn{align-self:flex-start;background:var(--sun);color:var(--ink)}

footer{padding-block:40px 48px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer img{height:36px;width:auto}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(22,20,46,.55);backdrop-filter:blur(6px);padding:16px}
.modal.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);border-radius:28px;max-width:860px;width:100%;max-height:calc(100% - 24px);overflow:auto;position:relative;animation:up .4s cubic-bezier(.2,.8,.2,1)}
@media (min-width:760px){.modal{align-items:center}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .art{aspect-ratio:21/9;overflow:hidden}
.sheet .art svg{width:100%;height:100%}
.sheet .x{position:absolute;top:14px;inset-inline-end:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.95);display:grid;place-items:center;z-index:2}
.sheet .x svg{width:18px;height:18px}
.sheet .in{padding:clamp(22px,4vw,40px)}
.sheet h2{font-size:clamp(28px,3.4vw,40px);font-weight:700;margin:8px 0 12px}
.sheet .lead{color:var(--muted);margin:0 0 20px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.box{background:var(--paper);border-radius:16px;padding:18px 20px}
.box h4{font-size:15px;font-weight:600;margin-bottom:8px}
.box ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.box li{display:flex;gap:10px;align-items:flex-start}
.box li::before{content:"";width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--c,var(--coral));flex:none;margin-top:9px}
.md h2,.md h3{font-size:20px;margin:18px 0 8px}
.md p{margin:0 0 12px;color:#34314f}
.md ul{margin:0 0 12px;padding-inline-start:20px;color:#34314f}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-family:var(--display);font-size:14px;z-index:90;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility .35s;visibility:hidden}
.toast.show{transform:translate(-50%,0);visibility:visible}

.wa-float{position:fixed;bottom:22px;inset-inline-end:22px;width:58px;height:58px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(37,211,102,.7);z-index:50;transition:transform .2s}
.wa-float:hover{transform:scale(1.07)}
.wa-float svg{width:28px;height:28px}

/* responsive */
@media (max-width:1020px){
  .services{grid-template-columns:repeat(2,1fr)}
  .offers{grid-template-columns:1fr 1fr}
  .dests{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:860px){
  .nav{display:none}
  .menu{display:inline-flex}
  .nav.open{display:flex;position:absolute;top:76px;inset-inline:12px;flex-direction:column;background:#fff;border-radius:18px;padding:10px;box-shadow:0 20px 40px -20px rgba(22,20,46,.3)}
  .hero .hero-grid{grid-template-columns:1fr}
  .globe{max-width:380px;order:-1}
  .pkgs,.posts,.about,.advice-wrap{grid-template-columns:1fr}
  .post:first-child{grid-row:auto}
  .advice-intro{position:static}
  .steps{grid-template-columns:1fr}
  .step:not(:last-child)::after{display:none}
  .top .btn span{display:none}
}
@media (max-width:620px){
  .services,.offers,.cols,.creds{grid-template-columns:1fr}
  .cred.full{grid-column:auto}
  .dests{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1*clamp(16px,4vw,40px));padding-inline:clamp(16px,4vw,40px);padding-bottom:6px;scrollbar-width:none}
  .dests::-webkit-scrollbar{display:none}
  .dest-card{flex:0 0 72%;scroll-snap-align:start}
  .post:not(:first-child){flex-direction:column}
  .svc{display:grid;grid-template-columns:48px 1fr;column-gap:16px;padding:22px 20px}
  .svc .ic{grid-row:span 2}
  .wa-float{bottom:16px;width:52px;height:52px}
  .post:not(:first-child) .art{width:100%;aspect-ratio:16/9}
  .chip.c1{inset-inline-end:0}.chip.c2{inset-inline-start:0}
  .brand img{height:38px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

ار الطيران والفنادق خارج أسابيع الذروة بقليل، ويبقى الطقس جيداً في الغالب.", "body": "Peak weeks cost more because everyone wants them. The weeks on either side often cost noticeably less.\n\nCheck two or three date ranges before you commit. A shift of a few days can change the price of the whole trip.\n\nTell us your flexible dates and we will compare options for you.", "bodyAr": "أسابيع الذروة أغلى لأن الجميع يريدها. والأسابيع التي قبلها وبعدها أرخص بشكل ملحوظ في الغالب.\n\nقارن بين نطاقين أو ثلاثة من التواريخ قبل أن تحجز. تغيير الموعد بضعة أيام قد يغير سعر الرحلة كلها.\n\nأخبرنا بتواريخك المرنة وسنقارن لك الخيارات.", "image": "e9d11d35eb6412ca7d2131fda08ebbf5", "visible": true}, {"id": "b3", "title": "Packing for a mountain road trip", "titleAr": "ماذا تحزم لرحلة برية إلى الجبال", "category": "Tips", "categoryAr": "نصائح", "date": "2026-09-10", "excerpt": "Layers, a proper jacket, and the small things you will be glad to have in the car.", "excerptAr": "طبقات من الملابس، وسترة مناسبة، وأشياء صغيرة ستكون سعيداً بوجودها في السيارة.", "body": "Mountain weather changes quickly, so pack in layers you can add or remove.\n\n- A light waterproof jacket\n- Comfortable shoes with grip\n- A power bank and a car charger\n- Water and snacks for the drive\n\nLeave a little room in the bag for things you buy on the way home.", "bodyAr": "يتغير طقس الجبال بسرعة، لذا احزم ملابس متعددة الطبقات يمكنك إضافتها أو خلعها.\n\n- سترة خفيفة مقاومة للماء\n- حذاء مريح بقبضة جيدة\n- شاحن متنقل وشاحن للسيارة\n- ماء ووجبات خفيفة للطريق\n\nاترك مساحة صغيرة في الحقيبة لما تشتريه في طريق العودة.", "image": "31ea3b7f6d18346fe6df808f2a5f5449", "visible": true}], "advice": [{"id": "a1", "category": "Before you book", "categoryAr": "قبل الحجز", "title": "Compare the total price, not just the fare", "titleAr": "قارن السعر الإجمالي لا سعر التذكرة فقط", "body": "A cheap fare can come with extra charges for bags, seats and transfers. Add everything up before you compare two options.", "bodyAr": "قد تأتي /* ---------- markdown (headings, lists, paragraphs, bold) ---------- */
function md(s){
 if(!s)return '';
 const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
 return s.split(/\n{2,}/).map(b=>{
  const lines=b.split('\n');
  if(/^#{1,3}\s/.test(lines[0])){const h=lines.shift().replace(/^#+\s*/,'');return `<h3>${inl(h)}</h3>`+(lines.length?md(lines.join('\n')):'');}
  if(lines.every(l=>/^\s*[-*]\s/.test(l)))return '<ul>'+lines.map(l=>`<li>${inl(l.replace(/^\s*[-*]\s/,''))}</li>`).join('')+'</ul>';
  return `<p>${lines.map(inl).join('<br>')}</p>`;
 }).join('');
}

 <section id="advice" style="padding-top:0"><div class="wrap advice-wrap">
  <div class="advice-intro"><span class="kicker">06 / ${t('aK')}</span><h2 style="font-size:clamp(34px,4.6vw,60px);font-weight:700;letter-spacing:-.015em">${t('aT')}</h2><p>${t('aP')}</p><a class="btn btn-ghost" target="_blank" rel="noopener" href="${wa(t('waMsg'))}">${I.wa} ${t('ask')}</a></div>
  <div class="acc">${(()=>{const g={};vis(D.advice).forEach(a=>{(g[a.category]=g[a.category]||[]).push(a);});return Object.values(g).map(arr=>`<div class="acc-group">${esc(L(arr[0],'category'))}</div>`+arr.map(a=>`<details><summary>${esc(L(a,'title'))}<span class="pm">${I.plus}</span></summary><div class="ans">${md(L(a,'body'))}</div></details>`).join('')).join('');})()}</div>
 </div></section>

 <section id="contact" style="padding-top:0"><div class="wrap about">
  <div class="about-card"><span class="kicker">07 / ${t('abK')}</span><h2>${t('abT')}</h2>${md(L(S,'about'))}
   <div class="creds">
    <div class="cred"><small>${t('lic')}</small><b>${esc(S.licenseNo)}</b></div>
    <div class="cred"><small>${t('cr')}</small><b>${esc(S.crNo)}</b></div>
    <div class="cred full"><small>${t('licType')}</small><b style="font-family:var(--display);font-size:15px;direction:inherit">${esc(L(S,'licenseType'))}</b></div>
   </div></div>
  <div class="contact"><h3>${t('cT')}</h3><p>${t('cP')}</p>
   <div class="clist">
    <a href="${wa(t('waMsg'))}" target="_blank" rel="noopener">${I.wa}<span><small>${t('phone')}</small><span class="ltr">${phonePretty(S.whatsapp)}</span></span></a>
    ${S.email?`<a href="mailto:${esc(S.email)}">${I.mail}<span><small>${t('email')}</small><span class="ltr">${esc(S.email)}</span></span></a>`:''}
    <a href="${esc(S.maps)}" target="_blank" rel="noopener">${I.pin}<span><small>${t('addr')} · ${t('maps')}</small><span>${esc(L(S,'address'))}</span></span></a>
   </div>
   <div class="socials">
    ${S.instagram?`<a href="https://www.instagram.com/${esc(S.instagram)}" target="_blank" rel="noopener" aria-label="Instagram">${I.ig}</a>`:''}
    ${S.tiktok?`<a href="https://www.tiktok.com/@${esc(S.tiktok)}" target="_blank" rel="noopener" aria-label="TikTok">${I.tt}</a>`:''}
    ${S.snapchat?`<a href="https://www.snapchat.com/add/${esc(S.snapchat)}" target="_blank" rel="noopener" aria-label="Snapchat">${I.sc}</a>`:''}
    ${S.x?`<a href="https://x.com/${esc(S.x)}" target="_blank" rel="noopener" aria-label="X">${I.xx}</a>`:''}

 document.getElementById('foot').innerHTML=`<img src="${document.querySelector('.brand img').src}" alt="Travelage | عصر السفر"><span>© ${new Date().getFullYear()} ${esc(ar()?(S.legalAr||S.nameAr):(S.legal||'Travelage Travel & Tourism'))} · ${t('lic')} <span class="ltr">${esc(S.licenseNo)}</span> · ${t('cr')} <span class="ltr">${esc(S.crNo)}</span> · ${t('rights')}</span>`;
 renderPkgs();
}

function renderPkgs(){
 const pk=vis(D.packages).filter(p=>cat==='all'||p.category===cat);
 document.getElementById('pkgs').innerHTML=pk.map(p=>`<button class="pkg" type="button" data-pkg="${p.id}">
  <div class="art">${poster(p.code,p.id)}<span class="code">RUH → ${esc(p.code)}</span><span class="cat">${esc(L(p,'category'))}</span></div>
  <div class="body"><div class="meta"><span>${I.pin}${esc(L(p,'destination'))}</span><span>${I.cal}${t('days')(p.days,p.nights)}</span></div>
  <h3>${esc(L(p,'title'))}</h3><p>${esc(L(p,'summary'))}</p>
  <div class="foot"><span style="font-family:var(--display);font-weight:600;font-size:15px">${t('viewPkg')}</span><span class="arrow">${I.arrow}</span></div></div></button>`).join('');
 document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cat===cat));
}

/* ---------- modal ---------- */
const modal=document.getElementById('modal'),sheet=document.getElementById('sheet');let lastFocus=null;
function openModal(html){lastFocus=document.activeElement;sheet.innerHTML=`<button class="x" type="button" aria-label="${t('close')}">${I.x}</button>`+html;modal.classList.add('open');document.body.style.overflow='hidden';sheet.scrollTop=0;sheet.querySelector('.x').focus();}
function closeModal(){modal.classList.remove('open');document.body.style.overflow='';if(lastFocus)lastFocus.focus();}
function openPkg(id){
 const p=D.packages.find(x=>x.id===id);if(!p)return;
 const inc=ar()?(p.includesAr||p.includes):(p.includes||p.includesAr), hl=ar()?(p.highlightsAr||p.highlights):(p.highlights||p.highlightsAr);
 openModal(`<div class="art">${poster(p.code,p.id+'m')}</div><div class="in">
  <div class="meta" style="display:flex;gap:14px;color:var(--muted);font-size:14px;flex-wrap:wrap"><span class="ltr" style="font-family:var(--mono);font-weight:700;color:var(--coral)">RUH → ${esc(p.code)}</span><span>${esc(L(p,'destination'))}</span><span>${t('days')(p.days,p.nights)}</span></div>
  <h2>${esc(L(p,'title'))}</h2><p class="lead">${esc(L(p,'summary'))}</p>
  <div class="cols">${hl&&hl.length?`<div class="box" style="--c:var(--sun)"><h4>${t('highlights')}</h4><ul>${hl.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}${inc&&inc.length?`<div class="box" style="--c:var(--indigo)"><h4>${t('includes')}</h4><ul>${inc.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div>
  <div class="md">${md(L(p,'details'))}</div>
  <div class="bar"><span style="color:var(--muted)">${t('askQuote')}</span><a class="btn btn-coral" target="_blank" rel="noopener" href="${wa(t('waPkg')(L(p,'title')))}">${I.wa} ${t('book')}</a></div>
 </div>`);
}
function openPost(id){
 const p=D.posts.find(x=>x.id===id);if(!p)return;
 openModal(`<div class="art">${postArt(p)}</div><div class="in"><div class="tagline" style="display:flex;gap:10px;font-size:14px;color:var(--muted);font-family:var(--display)"><b style="color:var(--coral)">${esc(L(p,'category'))}</b><span>${fmtDate(p.date)}</span></div><h2>${esc(L(p,'title'))}</h2><div class="md" style="max-width:66ch">${md(L(p,'body'))}</div>
 <div class="bar"><span style="color:var(--muted)">${t('cP')}</span><a class="btn btn-ink" target="_blank" rel="noopener" href="${wa(t('waMsg'))}">${I.wa} ${t('wa')}</a></div></div>`);
}

/* ---------- events ---------- */
const toastEl=document.getElementById('toast');let tt=0;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2200);}
document.addEventListener('click',async e=>{
 const pkg=e.target.closest('[data-pkg]');if(pkg){openPkg(pkg.dataset.pkg);return;}
 const post=e.target.closest('[data-post]');if(post){openPost(post.dataset.post);return;}
 const c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;renderPkgs();return;}
 const cp=e.target.closest('[data-copy]');if(cp){try{await navigator.clipboard.writeText(cp.dataset.copy);}catch(err){const r=document.createRange();r.selectNodeContents(cp);const s=getSelection();s.removeAllRanges();s.addRange(r);}toast(t('copied')+': '+cp.dataset.copy);return;}
 if(e.target.closest('.x')||e.target===modal){closeModal();return;}
 if(e.target.closest('#nav a')){document.getElementById('nav').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeModal();});
document.getElementById('lang').addEventListener('click',()=>{lang=ar()?'en':'ar';try{localStorage.setItem('tvl-lang',lang);}catch(e){}render();});
document.getElementById('menu').addEventListener('click',e=>{const n=document.getElementById('nav');const o=n.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o);});
const top=document.getElementById('top');addEventListener('scroll',()=>top.classList.toggle('scrolled',scrollY>8),{passive:true});

render();
})();
</script>
